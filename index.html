<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RROLL</title>

<style>
:root{
--bg:#050505;
--border:rgba(255,255,255,0.12);
--text:#fff;
--muted:rgba(255,255,255,0.6);
--gold:#c9a84c;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,system-ui;
background:#050505;
color:#fff;
}

.wrap{max-width:980px;margin:auto;padding:20px}

/* HERO */
.hero{
border:1px solid var(--border);
border-radius:24px;
padding:24px;
background:rgba(255,255,255,0.03);
backdrop-filter:blur(14px);
}

.hero-label{
font-size:12px;
letter-spacing:0.2em;
color:var(--muted);
margin-bottom:12px;
}

.title{
font-size:42px;
letter-spacing:0.2em;
font-weight:900;
margin:0 0 18px;
}

/* COTW */
.cotw-scroll{
display:flex;
gap:12px;
overflow-x:auto;
}

.cotw-card{
min-width:220px;
border:1px solid rgba(201,168,76,0.3);
padding:12px;
border-radius:16px;
}

.cotw-name{font-weight:800;margin-bottom:6px}
.cotw-btn{
display:block;
margin-top:10px;
padding:10px;
text-align:center;
border-radius:10px;
border:1px solid var(--gold);
color:var(--gold);
text-decoration:none;
}

/* SEARCH + FILTER */
.search-box input{
width:100%;
padding:12px;
background:#111;
border:none;
color:#fff;
border-radius:12px;
margin-top:16px;
}

.filter-box{
display:flex;
gap:8px;
overflow-x:auto;
margin-top:12px;
}

.filter-btn{
padding:10px 14px;
border-radius:999px;
border:none;
background:#111;
color:#fff;
cursor:pointer;
}

.filter-btn.active{
background:#fff;
color:#000;
}

/* CARDS */
.grid{
display:grid;
gap:12px;
margin-top:20px;
}

.card{
border:1px solid var(--border);
border-radius:16px;
padding:14px;
background:rgba(255,255,255,0.03);
}

.casino-name{
font-weight:800;
font-size:16px;
margin-bottom:6px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr 1fr;
gap:8px;
margin-top:10px;
}

.visit-btn,.copy-btn,.editor-btn{
padding:10px;
border-radius:10px;
border:none;
font-weight:700;
cursor:pointer;
}

.visit-btn{background:#fff;color:#000}
.copy-btn,.editor-btn{background:#111;color:#fff}
</style>
</head>

<body>
<div class="wrap">

<!-- HERO -->
<section class="hero">

<div class="hero-label">
The first online gambling multitool
</div>

<h1 class="title">RROLL</h1>

<!-- COTW -->
<div class="cotw">
<div class="cotw-scroll" id="cotwScroll"></div>
</div>

<!-- SEARCH -->
<div class="search-box">
<input id="searchInput" placeholder="Search casino name..." />
</div>

<!-- FILTER -->
<div class="filter-box">
<button class="filter-btn active" data-filter="all">All</button>
<button class="filter-btn" data-filter="sweepstakes">Sweepstakes</button>
<button class="filter-btn" data-filter="crypto">Crypto</button>
<button class="filter-btn" data-filter="other">Other</button>
</div>

</section>

<!-- LIST -->
<div class="grid" id="grid"></div>

</div>

<script>

const casinos = [
{name:"wowvegas",category:"sweepstakes",url:"https://wowvegas.com"},
{name:"stake.us",category:"sweepstakes",url:"https://stake.us"},
{name:"shuffle",category:"crypto",url:"https://shuffle.com"},
{name:"roobet",category:"crypto"},
{name:"chumba",category:"sweepstakes"}
]

const weekly = ["wowvegas","stake.us","shuffle"]

const grid=document.getElementById("grid")
const cotw=document.getElementById("cotwScroll")
const searchInput=document.getElementById("searchInput")

let filter="all"
let search=""

/* COTW */
function renderCOTW(){
cotw.innerHTML=""
weekly.forEach(name=>{
const c=casinos.find(x=>x.name===name)
if(!c)return
const el=document.createElement("div")
el.className="cotw-card"
el.innerHTML=`
<div class="cotw-name">${c.name}</div>
${c.url ? `<a class="cotw-btn" href="${c.url}" target="_blank">Open</a>` : `<div class="cotw-btn">No link</div>`}
`
cotw.appendChild(el)
})
}

/* CARDS */
function render(){
grid.innerHTML=""

casinos
.filter(c=>{
return (filter==="all"||c.category===filter)
&& c.name.includes(search.toLowerCase())
})
.forEach(c=>{
const el=document.createElement("div")
el.className="card"

el.innerHTML=`
<div class="casino-name">${c.name}</div>

<div class="actions">
${c.url
? `<a class="visit-btn" href="${c.url}" target="_blank">Open</a>`
: `<button class="editor-btn">Add</button>`}

<button class="copy-btn">Copy</button>
<button class="editor-btn">Edit</button>
</div>
`

grid.appendChild(el)
})
}

/* EVENTS */
searchInput.oninput=e=>{
search=e.target.value
render()
}

document.querySelectorAll(".filter-btn").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".filter-btn").forEach(b=>b.classList.remove("active"))
btn.classList.add("active")
filter=btn.dataset.filter
render()
}
})

render()
renderCOTW()

</script>
</body>
</html>
